# SSDF Week 6 - Hardened supply-chain pipeline
# NIST SP 800-218 v1.1: PO.5.1, PS.2.1, PS.3.1, PW.5.1, RV.1.1, RV.2.1 | EO 14028 Sec. 4(e)
#
# Hardening applied to the Week 5 pipeline (see pipeline_findings.md):
#   * top-level `permissions: read-all`; each job elevates only what it needs
#   * every third-party action pinned to a full 40-character commit SHA
#     (version tag kept as a comment so Dependabot/Renovate can update it)
#   * keyless signing with the job's short-lived GitHub OIDC token
#     (id-token: write) -> Fulcio certificate -> Rekor transparency log;
#     no long-lived signing key or registry password is stored as a secret
#   * CLI tools downloaded at a fixed version and checked against sha256
#   * release is gated by conftest (policy/attestation.rego) on VERIFIED
#     signature, SBOM attestation, SLSA provenance and grype results

name: Hardened Supply Chain Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: python:3.11-slim
  IMAGE_VERSION: v6.0
  COSIGN_VERSION: v3.1.3
  GRYPE_VERSION: 0.119.0
  GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
  CONFTEST_VERSION: 0.70.1
  CONFTEST_SHA256: 613d124b8f6c1f3cee890491f7ab19114cca5a2102ca47cb2e6c35b4c23f9c8a
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source-level gates carried forward from Week 5 (PW.5.1, RV.1.1)
  # ---------------------------------------------------------------------------
  source-gates:
    name: SAST, secrets, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install scanners (pinned)
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (fail on high)
        run: bandit -r app --severity-level high --confidence-level high

      - name: Dependency audit (hash-locked manifest)
        run: pip-audit -r app/requirements.txt --require-hashes --strict

  # ---------------------------------------------------------------------------
  # 2. Pull requests (incl. Dependabot/Renovate bumps): build + scan, no push
  # ---------------------------------------------------------------------------
  pr-image-scan:
    name: PR image SBOM + vulnerability scan
    if: github.event_name == 'pull_request'
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve base image digest
        run: |
          digest="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "BASE_IMAGE_PINNED=${BASE_IMAGE}@${digest}" >> "$GITHUB_ENV"

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ssdf-app:pr-${{ github.event.pull_request.number }}
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE_PINNED }}
          provenance: false
          sbom: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ssdf-app:pr-${{ github.event.pull_request.number }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install grype (pinned + checksum)
        run: |
          curl -sSfL -o grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          tar -xzf grype.tgz grype && sudo install -m 0755 grype /usr/local/bin/grype

      - name: Scan SBOM (grype)
        run: grype sbom:sbom.cyclonedx.json -o table -o json=grype_results.json

      - name: Vulnerability gate (undocumented Critical/High only, RV.2.1)
        run: python3 scripts/pr_vulnerability_gate.py --grype grype_results.json --exceptions policy/exceptions.json

  # ---------------------------------------------------------------------------
  # 3. Release: build, push, SBOM, keyless sign, attest (PS.3.1, PS.2.1)
  # ---------------------------------------------------------------------------
  release:
    name: Build, sign and attest
    if: github.event_name != 'pull_request'
    needs: source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # push image, signatures and attestations to GHCR
      id-token: write       # ephemeral OIDC token for keyless Sigstore signing
      attestations: write   # store SLSA provenance in GitHub attestations
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (GHCR requires lowercase)
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/ssdf-app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the job-scoped GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image digest
        run: |
          digest="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "BASE_IMAGE_PINNED=${BASE_IMAGE}@${digest}" >> "$GITHUB_ENV"

      - name: Build and push ssdf-app:v6.0
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_VERSION }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE_PINNED }}
          provenance: false   # provenance is generated and signed below
          sbom: false         # SBOM is generated by syft and signed below

      - name: Generate container CycloneDX SBOM (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Keyless sign image (OIDC -> Fulcio -> Rekor)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Sign and attach SBOM as in-toto attestation
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cyclonedx.json "$REF"

      - name: Generate signed SLSA v1 build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Archive SBOM (PS.3.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 4. Verify evidence and enforce policy-as-code (PS.2.1, PW.5.1, RV.2.1)
  # ---------------------------------------------------------------------------
  verify:
    name: Verify attestations + policy gate
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      DIGEST: ${{ needs.release.outputs.digest }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install grype and conftest (pinned + checksum)
        run: |
          curl -sSfL -o grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          curl -sSfL -o conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar -xzf grype.tgz grype && tar -xzf conftest.tgz conftest
          sudo install -m 0755 grype conftest /usr/local/bin/

      - name: Verify signature, SBOM attestation and SLSA provenance
        run: |
          IDENTITY="https://github.com/${REPO}/.github/workflows/hardened_pipeline.yml@refs/heads/main"
          REF="${IMAGE}@${DIGEST}"
          mkdir -p evidence
          set +e
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$REF" > evidence/cosign_verify.json 2> evidence/cosign_verify.err
          echo "SIG_RC=$?" >> "$GITHUB_ENV"
          cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$REF" > evidence/sbom_attestation.jsonl 2> evidence/sbom_attestation.err
          echo "SBOM_RC=$?" >> "$GITHUB_ENV"
          gh attestation verify "oci://${REF}" --repo "$REPO" \
            --signer-workflow "${REPO}/.github/workflows/hardened_pipeline.yml" \
            --format json > evidence/provenance_attestation.json 2> evidence/provenance_attestation.err
          echo "PROV_RC=$?" >> "$GITHUB_ENV"
          set -e
          cat evidence/*.err

      - name: Scan SBOM with grype (RV.1.1)
        run: grype sbom:sbom.cyclonedx.json -o table -o json=evidence/grype_results.json

      - name: Remediation report (RV.2.1)
        run: |
          python3 scripts/remediation_report.py --sbom sbom.cyclonedx.json \
            --grype evidence/grype_results.json --image "${IMAGE}@${DIGEST}" \
            --out evidence/remediation_report.md
          cat evidence/remediation_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Policy gate (conftest / OPA)
        run: |
          python3 scripts/build_policy_input.py \
            --image-ref "${IMAGE}:${IMAGE_VERSION}" --digest "$DIGEST" \
            --signature-json evidence/cosign_verify.json --signature-rc "$SIG_RC" --signature-method keyless \
            --sbom sbom.cyclonedx.json \
            --sbom-att evidence/sbom_attestation.jsonl --sbom-att-rc "$SBOM_RC" \
            --prov-att evidence/provenance_attestation.json --prov-att-rc "$PROV_RC" \
            --grype evidence/grype_results.json --out evidence/policy_input.json
          conftest verify --policy policy --no-color
          conftest test evidence/policy_input.json --policy policy \
            --data policy/exceptions.json --no-color | tee evidence/conftest_result.txt

      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: evidence/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 5. Deploy only the verified digest, behind a protected environment
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy verified digest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, verify]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy by immutable digest
        env:
          REF: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
        run: echo "Policy gate passed. Deploying ${REF} (digest-pinned, signed, attested)."
