# ORIGINAL pipeline inspected in Task 1 (Week 5 ci_hardened.yml, used as deploy.yml).
# Kept outside .github/workflows so it does not run. Findings: pipeline_findings.md

name: Hardened Build and Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_remediated.txt

      - name: Install application and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_remediated.txt
          python -m pip install bandit==1.8.6 pip-audit==2.9.0 cyclonedx-bom==7.1.0

      - name: Detect hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static application security testing
        run: bandit -r app_remediated.py --severity-level high --confidence-level high

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements_remediated.txt --strict

      - name: Generate and validate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements_remediated.txt \
            --output-format JSON \
            --output-file sbom-ci.json \
            --validate

      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom-ci.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Approved production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deployment gate passed
        run: echo "All security checks passed; approved deployment may begin."
